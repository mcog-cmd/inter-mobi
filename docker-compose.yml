services:

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inter_mobi}
      POSTGRES_USER: ${POSTGRES_USER:-inter_mobi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inter_mobi_pass}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inter_mobi_user} -d ${POSTGRES_DB:-inter_mobi}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-inter_mobi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-inter_mobi_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-inter_mobi_pass}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      - backend


volumes:
  postgres_data:
