services:
  db:
    image: postgis/postgis:16-3.4
    container_name: inter-mobi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inter_mobi
      POSTGRES_USER: inter_mobi_user
      POSTGRES_PASSWORD: inter_mobi_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inter_mobi_user -d inter_mobi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
